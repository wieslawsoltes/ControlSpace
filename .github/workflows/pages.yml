name: Uno browser and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-browser-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: nuget-browser-${{ runner.os }}-
      - name: Install .NET WebAssembly toolchain
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Test the same C# engine used by Uno
        run: dotnet run --project tests/ControlSpace.Tests -c Release -- --fixtures tests/fixtures
      - name: Workbench layout and editor session regressions
        run: dotnet run --project tests/ControlSpace.Workbench.Tests -c Release
      - name: Transactional tag table regressions
        run: dotnet run --project tests/ControlSpace.Table.Tests -c Release
      - name: Project navigation regressions
        run: dotnet run --project tests/ControlSpace.Navigation.Tests -c Release
      - name: HMI authoring and rendering regressions
        run: dotnet run --project tests/ControlSpace.Hmi.Tests -c Release
      - name: Program and ladder authoring regressions
        run: dotnet run --project tests/ControlSpace.Program.Tests -c Release
      - name: Publish the real Uno Skia WebAssembly app
        run: |
          dotnet publish src/ControlSpace.App -c Release -f net10.0-browserwasm \
            -p:ControlSpaceTargetFrameworks=net10.0-browserwasm \
            -p:WasmShellWebAppBasePath=/ControlSpace/ -o artifacts/browser
      - name: Stage runtime output, docs, and the separate prototype
        run: python tools/prepare-pages.py artifacts/browser artifacts/site
      - name: Package reusable Uno controls and workbench
        run: |
          for library in Controls.Uno Workbench.Uno; do
            dotnet pack "src/ControlSpace.$library" -c Release \
              -p:ControlSpaceTargetFrameworks=net10.0-browserwasm -o artifacts/packages
          done
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Test compiled Uno UI workflows under the Pages subpath
        run: |
          mkdir -p artifacts/serve
          ln -s "$PWD/artifacts/site" artifacts/serve/ControlSpace
          python -m http.server 4173 --directory artifacts/serve > artifacts/server.log 2>&1 &
          python tests/browser/uno_smoke.py http://127.0.0.1:4173/ControlSpace/
          python tests/browser/tag_table.py http://127.0.0.1:4173/ControlSpace/
          python tests/browser/program_editor.py http://127.0.0.1:4173/ControlSpace/
          python tests/browser/uno_performance_test.py http://127.0.0.1:4173/ControlSpace/
          python tests/browser/navigation_test.py http://127.0.0.1:4173/ControlSpace/
          python tests/browser/hmi_editor.py http://127.0.0.1:4173/ControlSpace/
          python tests/browser/hmi_shapes.py http://127.0.0.1:4173/ControlSpace/
      - name: Stage genuine Uno UI previews
        run: |
          mkdir -p artifacts/site/docs/uno
          cp artifacts/uno-verification/uno-*.png artifacts/site/docs/uno/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: uno-browser-verification
          path: |
            artifacts/uno-verification/
            artifacts/server.log
            artifacts/packages/*.nupkg
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          if-no-files-found: ignore
          name: uno-browser-site
          path: artifacts/site
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: artifacts/site
  deploy:
    needs: browser
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed source identity
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url = os.environ["PAGES_URL"].rstrip("/") + "/build-info.json?sha=" + os.environ["EXPECTED_SHA"]
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  assert data["commit"] == os.environ["EXPECTED_SHA"]
                  assert data["runtime"].startswith("Uno Platform")
                  print("Verified live Uno deployment:", data)
                  break
              except Exception:
                  if attempt == 11:
                      raise
                  time.sleep(5)
          PY
